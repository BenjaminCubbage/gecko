<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">

        <script src="wasm/compression.js" crossorigin="anonymous"></script>

        <title>Gecko!</title>

        <style>
            body {
                display: grid;
                margin:  0;

                --col-blue-1: #7298ff;
                --col-blue-2: #5979c8;
                --col-blue-3: #486ac1;
                --col-blue-4: #2c4a95;

                --rays-mask:  rgb(0 0 230 / 0.03);

                --dots-size:      1.6px;
                --dots-spacing-x: 36px;
                --dots-spacing-y: 36px;

                --dots-bg:  var(--col-blue-1);
                --dots-col: var(--col-blue-2);

                background-image:
                    repeating-conic-gradient(from 4.05deg,
                        var(--rays-mask) 0deg    16.2deg,
                        transparent      16.2deg 22.5deg
                    ),
                    radial-gradient(circle at calc(50% + var(--dots-size)) calc(0% + var(--dots-size)),  var(--dots-col) var(--dots-size), transparent var(--dots-size)),
                    radial-gradient(circle at calc(0% + var(--dots-size))  calc(50% + var(--dots-size)), var(--dots-col) var(--dots-size), transparent var(--dots-size));

                background-size:
                    100%,
                    var(--dots-spacing-x) var(--dots-spacing-y),
                    var(--dots-spacing-x) var(--dots-spacing-y);

                background-color: var(--dots-bg);
                background-repeat:
                    no-repeat,
                    repeat,
                    repeat;

                background-blend-mode: 
                    multiply, 
                    normal, 
                    normal;
            }

            #app {
                display: contents;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
