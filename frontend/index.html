<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">

        <script src="wasm/compression.js" crossorigin="anonymous"></script>
        
        <title>bdcanvas</title>

        <style>
            /*
                Prefix stuff here with INDEX-* to avoid name collisions.

                Some of this has been copied from txtr.css and vars.css, so 
                that it may be displayed while the rest of the assets load.
            */
            body {
                --col-blue-1: #7298ff;
                --col-blue-2: #486ac1;
                --col-blue-3: #2c4a95;

                --dots-size:      1.6px;
                --dots-spacing-x: 26px;
                --dots-spacing-y: 26px;
                
                --dots-bg:  var(--col-blue-1);
                --dots-col: var(--col-blue-2);

                background-image: radial-gradient(circle at top,    var(--dots-col) var(--dots-size), transparent var(--dots-size)),
                                  radial-gradient(circle at bottom, var(--dots-col) var(--dots-size), transparent var(--dots-size)),
                                  radial-gradient(circle at right,  var(--dots-col) var(--dots-size), transparent var(--dots-size)),
                                  radial-gradient(circle at left,   var(--dots-col) var(--dots-size), transparent var(--dots-size));

                background-color:      var(--dots-bg);
                background-size:       var(--dots-spacing-x) var(--dots-spacing-y);
                background-repeat:     repeat;
                background-position-y: 4px;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
