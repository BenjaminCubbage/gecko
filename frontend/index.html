<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Gecko!</title>

        <style>
            body {
                display: grid;
                margin:  0;

                --col-blue-1: #7298ff;
                --col-blue-2: #5979c8;
                --col-blue-3: #486ac1;
                --col-blue-4: #2B3D8C;

                --rays-mask:  rgb(0 0 230 / 0.03);

                --dots-size:      2px;
                --dots-spacing-x: 36px;
                --dots-spacing-y: 36px;

                --dots-bg:  var(--col-blue-1);
                --dots-col: var(--col-blue-2);

                height: 100dvh;
                width:  100dvw;

                background:
                    repeating-conic-gradient(from 4.05deg,
                        var(--rays-mask) 0deg    12.2deg,
                        transparent      12.2deg 22.5deg) 
                        center / 100%,
                    radial-gradient(circle at calc(50% + var(--dots-size)) calc(0% + var(--dots-size)),  var(--dots-col) var(--dots-size), transparent var(--dots-size)) 
                        center / var(--dots-spacing-x) var(--dots-spacing-y),
                    radial-gradient(circle at calc(0% + var(--dots-size))  calc(50% + var(--dots-size)), var(--dots-col) var(--dots-size), transparent var(--dots-size)) 
                        center / var(--dots-spacing-x) var(--dots-spacing-y)
                    var(--dots-bg);

                background-blend-mode: multiply, normal, normal;
            }

            #app {
                display: contents;
            }
        </style>
        
        <script src="wasm/compression.js" defer crossorigin></script>
        <script type="module" src="/src/main.js" defer></script>
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
